name: Broken formula or cask
description: Report a formula or cask that fails to install, build, or run.
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package name
      placeholder: example
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.2.3
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Paste the relevant output from `brew install` or `brew test`.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: brew doctor output
      description: Run `brew doctor` and paste anything relevant.
      render: text
