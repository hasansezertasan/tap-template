# typos configuration. The prek hook auto-writes fixes, so anything typos
# misreads must be allowlisted here or it will be rewritten.

# `sur` is the `:big_sur` macOS symbol Homebrew uses in cask `depends_on`
# stanzas; typos splits on the underscore and reads it as `sure`. Other
# Homebrew macOS symbols (`:ventura`, `:sonoma`, …) are real words or
# unambiguous, so only this one needs an entry.
[default.extend-words]
sur = "sur"

[files]
# .gitignore is generated by Cobo from upstream github/gitignore templates and
# is hash-sealed in cobo.lock; a rewrite here would break the seal.
extend-exclude = [".gitignore"]
